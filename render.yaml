# Render Blueprint for the Lectura backend (free "lite" mode).
# Dashboard -> New -> Blueprint -> pick this GitHub repo. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: lectura-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.lite
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false        # you type the value in the Render dashboard (never commit keys)
      - key: GEMINI_API_KEY
        sync: false        # needed for chat (Gemini embeddings)
      - key: CORS_ORIGINS
        value: '["https://your-app.vercel.app"]'   # replace with your Vercel URL

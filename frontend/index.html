<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LectureLens turns YouTube lectures and recordings into smart notes, flashcards, quizzes and a chat you can ask questions."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LectureLens – AI lecture notes, flashcards &amp; quizzes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before the page paints, so there's no light/dark flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ll-theme");
          var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
